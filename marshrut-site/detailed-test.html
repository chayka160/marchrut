function render(){if(page===-1){app.innerHTML=`<h1>Комплексный профориентационный тест</h1><p>Исследуй свои интересы и получи персональный рейтинг профессиональных сфер с примерами профессий.</p><div class="grid"><div class="chip">✦ <b>30 вопросов</b><br><small>6 тематических блоков</small></div><div class="chip">◷ <b>7–10 минут</b><br><small>В своём темпе</small></div><div class="chip">▥ <b>7 направлений</b><br><small>Рейтинг и профессии</small></div></div><p class="muted">Отвечай исходя из того, что тебе действительно интересно, а не того, что «правильно». Это исследовательский опрос интересов, не стандартизированная психологическая диагностика.</p><div class="buttons"><span></span><button class="btn" onclick="page=0;render()">Начать тест →</button></div>`;return}if(page===questions.length){startAnalysis();return}if(page===questions.length+1){showResults();return}const q=questions[page],choices=['Совсем не про меня','Скорее не про меня','Затрудняюсь ответить','Скорее про меня','Полностью про меня'];app.innerHTML=`<div class="muted">${esc(q.block)} · Вопрос ${page+1} из ${questions.length}</div><div class="progress"><div class="bar" style="width:${page/questions.length*100}%"></div></div><h2>${esc(q.text)}</h2><p>Насколько это утверждение соответствует твоим интересам?</p>${choices.map((c,i)=>`<button class="choice ${answers[page]===i?'active':''}" onclick="answers[${page}]=${i};render()">${answers[page]===i?'◉':'◯'} &nbsp;${c}</button>`).join('')}<div class="buttons"><button class="btn secondary" onclick="page--;render()">← Назад</button><button class="btn" ${answers[page]===null?'disabled':''} onclick="page++;render()">${page===questions.length-1?'Посмотреть результаты':'Далее →'}</button></div>`}
function calculateScores(){return fields.map((f,i)=>{let a=questions.map((q,j)=>q.field===i?answers[j]:null).filter(x=>x!==null);return {i,score:Math.round(a.reduce((s,x)=>s+x,0)/Math.max(1,a.length)/4*100)}}).sort((a,b)=>b.score-a.score)}

  clearInterval(analysisTimer);

  const draw=()=>{

  };
  draw();
  analysisTimer=setInterval(()=>{
    phase++;
    if(phase>=4){clearInterval(analysisTimer);analysisTimer=null;page=questions.length+1;try{showResults()}catch(e){console.error(e);app.innerHTML='<h2>Не удалось показать результат</h2><p>Попробуй обновить страницу.</p><button class="btn" onclick="page=-1;render()">На главную</button>'}}
    else draw();
  },700);
}

 ];
 app.innerHTML=`<div class="report report-v2">

 <div class="compact-section"><h2>🎯 Три подходящие сферы</h2><div class="sphere-grid">${top.map((s,i)=>`<div class="sphere-card ${i===0?'leading':''}"><div class="sphere-art">${symbols[s.i]}</div><strong>${esc(fields[s.i].name)}</strong>${i===0?'<span class="sphere-label">Основное направление</span>':''}</div>`).join('')}</div></div>

 </div>`;
}
